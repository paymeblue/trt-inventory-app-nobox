# Netlify build for a dynamic Next.js app (App Router, API routes, middleware).
# The Next.js runtime plugin provides the server runtime.

[build]
  command = "npm run build"
  # Must be ".next", not the repository root. The plugin refuses to run when the
  # publish directory equals the base directory, which is what happens if the
  # Netlify UI has publish left blank or set to "/". Settings here take
  # precedence over the UI, so this pins it correctly for every deploy.
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"
  # "Collecting build traces" is the most memory-hungry phase of next build and
  # is where this build was dying. Node's default heap is smaller than the
  # builder's available memory, so give it room.
  NODE_OPTIONS = "--max-old-space-size=4096"
  # Netlify skips devDependencies when NODE_ENV=production, which would remove
  # typescript, tailwind and the type packages that the build needs.
  NPM_FLAGS = "--include=dev"

[[plugins]]
  package = "@netlify/plugin-nextjs"
